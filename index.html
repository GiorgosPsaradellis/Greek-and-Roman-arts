<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>Ψαραδέλλης Γ. Τελική Εργασία</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>The Metropolitan Museum of Art (Greek & Roman Art)</h1>
    </header>

    <main>
        <section>
            <h2>Βασική Κατηγορία: Τμήματα του Μουσείου</h2>
            <table id="categoriesTable">
                <thead>
                    <tr>
                        <th>Όνομα Τμήματος</th>
                    </tr>
                </thead>
                <tbody id="categoriesBody">
                    </tbody>
            </table>
        </section>

        <section>
            <h2>10 Επιλεγμένα Ελληνικά Έργα Τέχνης</h2>
            <table id="artworksTable">
                <thead>
                    <tr>
                        <th>Τίτλος Έργου</th>
                        <th>Δημιουργός / Προέλευση</th>
                        <th>Ενέργεια</th>
                    </tr>
                </thead>
                <tbody id="artworksBody">
                    </tbody>
            </table>
        </section>

        <section id="imageContainer">
            <h2>Προβολή Εικόνας</h2>
            <div id="imagePlaceholder">
                <p>Επιλέξτε «Προβολή Εικόνας» από τη λίστα ώστε να εμφανιστεί το έργο τέχνης.</p>
            </div>
        </main>

    <script src="script.js"></script>
</body>
</html>
